version: '3'

services:
  base: &base
    image: chatwoot-wijaya:devbot-0f8122216-sop
    env_file: .env ## Change this file for customized env variables
    volumes:
      - storage_data:/app/storage
      - ${MARINE_CATALOG_PG_PASSWORD_FILE_HOST:?set MARINE_CATALOG_PG_PASSWORD_FILE_HOST}:${MARINE_CATALOG_PG_PASSWORD_FILE:?set MARINE_CATALOG_PG_PASSWORD_FILE}:ro

  rails:
    <<: *base
    depends_on:
      - postgres
      - redis
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']
    restart: always

  sidekiq:
    <<: *base
    depends_on:
      - postgres
      - redis
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    restart: always

  # WIJAYA_CUSTOM marine_sop_worker (Commit 1C): dedicated, resource-capped Sidekiq
  # worker that ONLY drains the isolated marine_sop queue at concurrency 1. Inherits the
  # normal base image/env/volumes but is the ONLY service carrying the SOP hardening
  # (no-new-privileges, all caps dropped, pids/mem/tmpfs caps) so rails and normal
  # sidekiq stay behaviorally unchanged.
  marine_sop_worker:
    <<: *base
    depends_on:
      - postgres
      - redis
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    command: ['bundle', 'exec', 'sidekiq', '-q', 'marine_sop', '-c', '1']
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    pids_limit: 256
    mem_limit: 2g
    tmpfs:
      - /tmp:size=256m,mode=1777

  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=chatwoot
      - POSTGRES_USER=postgres
      # Please provide your own password.
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}

  redis:
    image: redis:alpine
    restart: always
    command: ["sh", "-c", "redis-server --requirepass \"$REDIS_PASSWORD\""]
    env_file: .env
    volumes:
      - redis_data:/data
    ports:
      - '127.0.0.1:6380:6379'

volumes:
  storage_data:
  postgres_data:
  redis_data:
