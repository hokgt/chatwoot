  - id: development_version
    name: Wijaya Internal Development Versioning
    battery: custom/wijaya/batteries/development_version
    description: >
      Independent semantic versioning for Wijaya custom development, starting at
      v0.1.0 and decoupled from official Chatwoot versioning. Stores the version
      and changelog in-tree so it survives upstream updates, exposes it to the page
      bootstrap (window.globalConfig.WIJAYA_DEV_VERSION) via a minimal
      dashboard_controller hook, and renders it on General Settings via a Battery Vue
      component alongside the official Chatwoot version and build SHA. The native
      shared globalConfig store is untouched (restored to upstream); the Battery
      component reads window.globalConfig.WIJAYA_DEV_VERSION directly.
    custom_files:
      - custom/wijaya/batteries/development_version/version.yml
      - custom/wijaya/batteries/development_version/CHANGELOG.md
      - custom/wijaya/batteries/development_version/hooks.rb
      - custom/wijaya/batteries/development_version/scripts/bump_version.rb
      - custom/wijaya/batteries/development_version/README.md
      # Battery-owned build label component mounted by native BuildInfo.vue.
      - custom/wijaya/batteries/development_version/frontend/BuildVersion.vue
    core_hook_touchpoints:
      - app/controllers/dashboard_controller.rb
      - app/javascript/dashboard/routes/dashboard/settings/account/components/BuildInfo.vue
    tests:
      - spec/custom/wijaya/development_version_hooks_spec.rb


  - id: test_database_safety
    name: Containerized Test Database Isolation
    battery: custom/wijaya/batteries/test_database_safety
    description: >
      Fail-safe isolation so any containerized RAILS_ENV=test process can never
      connect to or operate on the production database, even when Compose supplies
      POSTGRES_DATABASE=chatwoot_production or a production DATABASE_URL. The guard is
      pure Ruby (no DB connection) invoked from the smallest possible hook in the
      config/database.yml test: section, so it runs before ActiveRecord connects. In
      test it ignores the generic POSTGRES_DATABASE, uses POSTGRES_TEST_DATABASE
      (default chatwoot_test), validates any DATABASE_URL/TEST_DATABASE_URL scheme and
      database name, promotes a validated TEST_DATABASE_URL to the effective connection,
      clears an unused generic DATABASE_URL on name-based selection, and fails closed
      with a sanitized message and nonzero exit. Outside test it is a no-op and does
      not alter production/development selection. Ships a documented
      `docker compose run --rm -T base` wrapper that runs a pure-Ruby preflight in the
      same one-off container before any Rails/DB command; the guard makes the env_file
      POSTGRES_DATABASE irrelevant, so containerized specs and later Marine Commit 1B
      verification stay isolated from production.
    custom_files:
      - custom/wijaya/batteries/test_database_safety/guard.rb
      - custom/wijaya/batteries/test_database_safety/bin/run_test_specs.sh
    core_hook_touchpoints:
      - config/database.yml
    tests:
      - spec/custom/wijaya/test_database_safety/guard_spec.rb

