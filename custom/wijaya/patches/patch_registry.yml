# Wijaya Corp Chatwoot custom patch registry
# Keep this file updated for every core hook and custom battery touchpoint.

patches:
  - id: ads_tracking_ctwa_referral
    name: Ads Tracking / CTWA referral attribution
    battery: custom/wijaya/batteries/ads_tracking
    description: >
      Normalizes Meta WhatsApp CTWA, Messenger, and Instagram referral payloads
      into message content_attributes.ads_referral and renders an ad preview above
      the first inbound message bubble.
    custom_files:
      - custom/wijaya/batteries/ads_tracking/referral_parser.rb
      - custom/wijaya/batteries/ads_tracking/hooks.rb
      - custom/wijaya/batteries/ads_tracking/frontend/AdsReferral.vue
    core_hook_touchpoints:
      - app/services/whatsapp/incoming_message_base_service.rb
      - app/builders/messages/facebook/message_builder.rb
      - app/builders/messages/instagram/base_message_builder.rb
      - lib/integrations/facebook/message_parser.rb
      - app/javascript/dashboard/components-next/message/Message.vue
    tests:
      - spec/services/meta_ads_referral_parser_spec.rb
      - spec/services/whatsapp/incoming_message_whatsapp_cloud_service_spec.rb
      - spec/builders/messages/facebook/message_builder_spec.rb
      - spec/builders/messages/instagram/message_builder_spec.rb

  - id: custom_roles_rbac
    name: Custom Roles RBAC
    battery: custom/wijaya/batteries/custom_roles
    description: >
      Centralizes Wijaya custom role RBAC behavior for conversation visibility,
      assignment authorization, custom role validation, agent role assignment,
      and frontend role/permission UX while keeping Chatwoot core changes as
      minimal hook calls.
    custom_files:
      - custom/wijaya/batteries/custom_roles/hooks.rb
      - custom/wijaya/batteries/custom_roles/frontend/permissions.js
    core_hook_touchpoints:
      - app/builders/agent_builder.rb
      - app/controllers/api/v1/accounts/agents_controller.rb
      - app/controllers/api/v1/accounts/bulk_actions_controller.rb
      - app/controllers/api/v1/accounts/conversations/assignments_controller.rb
      - app/controllers/api/v1/accounts/conversations/base_controller.rb
      - app/controllers/api/v1/accounts/conversations_controller.rb
      - app/finders/conversation_finder.rb
      - app/javascript/dashboard/components/widgets/conversation/contextMenu/Index.vue
      - app/javascript/dashboard/components/widgets/conversation/conversationBulkActions/Index.vue
      - app/javascript/dashboard/helper/permissionsHelper.js
      - app/javascript/dashboard/routes/dashboard/conversation/ConversationAction.vue
      - app/javascript/dashboard/routes/dashboard/settings/customRoles/Index.vue
      - app/javascript/dashboard/routes/dashboard/settings/customRoles/component/CustomRoleModal.vue
      - app/javascript/dashboard/routes/dashboard/settings/customRoles/customRole.routes.js
      - app/models/account_user.rb
      - app/services/conversations/permission_filter_service.rb
      - enterprise/app/models/custom_role.rb
      - enterprise/app/models/enterprise/account_user.rb
      - enterprise/app/policies/enterprise/conversation_policy.rb
      - enterprise/app/services/enterprise/conversations/permission_filter_service.rb
    tests:
      - spec/controllers/api/v1/accounts/bulk_actions_controller_spec.rb
      - spec/controllers/api/v1/accounts/conversations/assignments_controller_spec.rb
      - spec/controllers/api/v1/accounts/conversations/messages_controller_spec.rb
      - spec/enterprise/controllers/api/v1/accounts/conversations_controller_spec.rb
      - spec/enterprise/controllers/api/v1/accounts/custom_roles_controller_spec.rb
      - spec/enterprise/policies/conversation_policy_spec.rb
      - spec/enterprise/services/enterprise/conversations/permission_filter_service_spec.rb
      - spec/finders/conversation_finder_spec.rb
  - id: enterprise_extension_compat
    name: Enterprise Extension Custom Namespace Compat
    battery: custom/wijaya/batteries/enterprise_extension_compat
    description: >
      Guards const_get_maybe_false against non-module receivers (false) when
      ChatwootApp.extensions includes 'custom' but no Custom module namespace
      is defined at the Object level. Without this guard, Rails environment
      loading crashes during assets:precompile and at runtime.
    custom_files: []
    core_hook_touchpoints:
      - config/initializers/01_inject_enterprise_edition_module.rb
    tests: []

  - id: meta_ads_team_routing
    name: Meta Ads Ad ID -> Team Routing
    battery: custom/wijaya/batteries/meta_ads_team_routing
    description: >
      Account-scoped mapping of Meta Ads Ad IDs (normalized referral source_id) to
      Chatwoot Teams. A central routing service injects only conversation_params[:team_id]
      before Conversation.create! for brand-new WhatsApp/Messenger/Instagram conversations,
      so Chatwoot's native assignment engine picks up the team naturally. Reuses the
      existing AdsTracking::ReferralParser for source_id normalization. Never sets
      assignee_id, never overrides an existing team_id, and leaves organic traffic
      untouched. Includes an admin-only dashboard API and a Settings -> Wijaya ->
      Meta Ads Routing management UI.
    custom_files:
      - custom/wijaya/batteries/meta_ads_team_routing/routing_rule.rb
      - custom/wijaya/batteries/meta_ads_team_routing/routing_service.rb
      - custom/wijaya/batteries/meta_ads_team_routing/hooks.rb
      - app/controllers/api/v1/accounts/wijaya/meta_ads_team_routing_rules_controller.rb
      - db/migrate/20260702000000_create_wijaya_meta_ads_team_routing_rules.rb
      - app/javascript/dashboard/api/metaAdsRouting.js
      - app/javascript/dashboard/store/modules/metaAdsRouting.js
      - app/javascript/dashboard/routes/dashboard/settings/wijaya/wijaya.routes.js
      - app/javascript/dashboard/routes/dashboard/settings/wijaya/Index.vue
      - app/javascript/dashboard/routes/dashboard/settings/wijaya/RoutingRuleModal.vue
      - app/javascript/dashboard/i18n/locale/en/wijayaMetaAdsRouting.json
    core_hook_touchpoints:
      - app/services/whatsapp/incoming_message_base_service.rb
      - app/builders/messages/facebook/message_builder.rb
      - app/builders/messages/instagram/base_message_builder.rb
      - config/initializers/wijaya_meta_ads_team_routing.rb
      - config/routes.rb
      - app/javascript/dashboard/store/index.js
      - app/javascript/dashboard/routes/dashboard/settings/settings.routes.js
      - app/javascript/dashboard/components-next/sidebar/Sidebar.vue
      - app/javascript/dashboard/i18n/locale/en/index.js
      - app/javascript/dashboard/i18n/locale/en/settings.json
    tests:
      - spec/custom/wijaya/meta_ads_team_routing/routing_rule_spec.rb
      - spec/custom/wijaya/meta_ads_team_routing/routing_service_spec.rb


  - id: erp_lead_sidebar
    name: ERPNext Lead Sidebar Form
    battery: custom/wijaya/batteries/erp_lead_sidebar
    description: >
      Chatwoot-owned ERPNext Lead creation sidebar for conversations. Stores a
      resilient local draft per conversation, autofills only approved fields from
      contact/Meta Ads metadata, converts Market Customer and Jenis Pakaian visual
      checkbox groups into the documented ERP integer fields, and syncs a strict
      Phase 1 Lead payload to ERPNext without Lead Activity child rows.
    custom_files:
      - custom/wijaya/batteries/erp_lead_sidebar/config.rb
      - custom/wijaya/batteries/erp_lead_sidebar/lead_draft.rb
      - custom/wijaya/batteries/erp_lead_sidebar/payload_builder.rb
      - custom/wijaya/batteries/erp_lead_sidebar/sync_service.rb
      - custom/wijaya/batteries/erp_lead_sidebar/refresh_service.rb
      - custom/wijaya/batteries/erp_lead_sidebar/options_service.rb
      - custom/wijaya/batteries/erp_lead_sidebar/frontend/ErpLeadPanel.vue
      - custom/wijaya/batteries/erp_lead_sidebar/frontend/fieldConfig.js
      - custom/wijaya/batteries/erp_lead_sidebar/frontend/mappings.js
      - app/controllers/api/v1/accounts/wijaya/erp_lead_drafts_controller.rb
      - app/javascript/dashboard/api/wijayaErpLeadDrafts.js
      - db/migrate/20260706000000_create_wijaya_erp_lead_drafts.rb
    core_hook_touchpoints:
      - config/initializers/wijaya_erp_lead_sidebar.rb
      - config/routes.rb
      - app/models/conversation.rb
      - app/javascript/dashboard/routes/dashboard/conversation/ContactPanel.vue
    tests:
      - spec/custom/wijaya/erp_lead_sidebar/payload_builder_spec.rb
      - spec/custom/wijaya/erp_lead_sidebar/refresh_service_smoke.rb

  - id: development_version
    name: Wijaya Internal Development Versioning
    battery: custom/wijaya/batteries/development_version
    description: >
      Independent semantic versioning for Wijaya custom development, starting at
      v0.1.0 and decoupled from official Chatwoot versioning. Stores the version
      and changelog in-tree so it survives upstream updates, exposes it to the
      frontend globalConfig via a minimal dashboard_controller hook, and renders
      it on General Settings alongside the official Chatwoot version and build SHA.
    custom_files:
      - custom/wijaya/batteries/development_version/version.yml
      - custom/wijaya/batteries/development_version/CHANGELOG.md
      - custom/wijaya/batteries/development_version/hooks.rb
      - custom/wijaya/batteries/development_version/scripts/bump_version.rb
      - custom/wijaya/batteries/development_version/README.md
    core_hook_touchpoints:
      - app/controllers/dashboard_controller.rb
      - app/javascript/shared/store/globalConfig.js
      - app/javascript/dashboard/routes/dashboard/settings/account/components/BuildInfo.vue
    tests:
      - spec/custom/wijaya/development_version_hooks_spec.rb


