# Wijaya Corp Chatwoot custom patch registry
# Keep this file updated for every core hook and custom battery touchpoint.

patches:
  - id: wijaya_core
    name: Wijaya Batteries Core Loader
    battery: custom/wijaya/batteries/core
    description: >
      Single generic integration point for all Wijaya feature batteries. One core
      initializer (config/initializers/wijaya.rb) requires the generic core loader,
      which discovers every custom/wijaya/batteries/<feature>/loader.rb, requires it
      (each self-registers), and runs each feature loader's setup! fail-open at boot.
      Replaces the retired per-feature config/initializers/wijaya_*.rb files. The core
      loader owns no feature logic; every feature battery owns its own loader.rb.

      The core also owns two generic integration primitives consumed by native hot-path
      hooks: (1) Wijaya::Batteries::Core::Hooks — a fail-open dispatcher that resolves a
      feature hook module, invokes a named hook, rescues StandardError AND ScriptError
      (broken/half-loaded batteries), and returns the caller-supplied native default (so a
      missing/disabled/erroring battery never changes native behavior). Every native touch
      point additionally guards the dispatch behind `defined?(Wijaya::Batteries::Core::Hooks)`
      so that when the battery system never booted (constant undefined) the seam uses/returns
      its exact upstream default and never raises NameError. (2) Wijaya::Batteries::Routes — a single route
      registrar drawn by one consolidated `Wijaya::Batteries::Routes.draw(self)` call in
      config/routes.rb (WIJAYA_CUSTOM wijaya_routes marker), replacing the retired
      per-feature marine_ai/meta_ads_team_routing/erp_lead_sidebar/marine_ai_provisioning
      route blocks. core/routes.rb owns only generic orchestration (static battery ->
      module map + isolated, fail-open require+draw for StandardError AND ScriptError);
      each battery's endpoint definitions live in its own routes.rb.
    custom_files:
      - custom/wijaya/batteries/core/loader.rb
      - custom/wijaya/batteries/core/hooks.rb
      - custom/wijaya/batteries/core/routes.rb
      # Per-battery route modules drawn in isolation by core/routes.rb.
      - custom/wijaya/batteries/marine_ai/routes.rb
      - custom/wijaya/batteries/meta_ads_team_routing/routes.rb
      - custom/wijaya/batteries/erp_lead_sidebar/routes.rb
      # Inventory of every native hook touchpoint: purpose, flow, native default,
      # fail-open/closed behavior, risk, and necessity for each battery seam.
      - custom/wijaya/batteries/HOOKS.md
    core_hook_touchpoints:
      - config/initializers/wijaya.rb
      - config/routes.rb
      # Tailwind content array includes battery frontend paths so i-lucide/i-woot
      # icon classes used only in battery files are generated in compiled CSS.
      - tailwind.config.js
    tests:
      - spec/custom/wijaya/batteries/core/hooks_spec.rb
      # Proves every native seam falls back to its exact upstream default when the
      # core Hooks constant is undefined (battery system not booted).
      - spec/custom/wijaya/batteries/core/native_seam_fail_open_spec.rb

