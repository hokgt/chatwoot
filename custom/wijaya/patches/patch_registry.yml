  - id: marine_ai_provisioning
    name: Marine AI PostgreSQL Provisioning UI
    battery: custom/wijaya/batteries/marine_ai
    description: >
      Installation-level, admin-only UI in Marine AI Settings to provision a
      dedicated Marine PostgreSQL database + a single LOGIN account inside the
      existing cluster, with an auto-generated internal NOLOGIN owner. All SQL
      orchestration lives in battery services (advisory-locked, compensating saga;
      strict identifier validation; sanitized errors; structured audit; catalog-
      based privilege matrix). Controllers delegate only; Vue holds no SQL. The
      existing PostgreSQL superuser credential comes solely from a read-only Docker
      secret file (mounted into rails only) and is never persisted/logged/echoed.
      Durable NON-SECRET state lives in
      a single MARINE_PROVISIONING_STATE InstallationConfig row; no password is
      ever stored. Hardens the existing Chatwoot DB ACL (REVOKE CONNECT FROM
      PUBLIC + explicit GRANT to the app role) and verifies fresh app connectivity
      before marking setup complete.
    custom_files:
      - custom/wijaya/batteries/marine_ai/app/services/marine/provisioning/errors.rb
      - custom/wijaya/batteries/marine_ai/app/services/marine/provisioning/config.rb
