# ---------------------------------------------------------------------------
# WIJAYA battery overlay — narrow, cop-specific + path-specific exclusions.
# Scope is limited to the Wijaya battery trees; core app/spec code is untouched
# and every other cop still runs against these paths. See CLAUDE.md "Battery".
# ---------------------------------------------------------------------------

# Battery specs live under spec/custom/wijaya/** but describe namespaced classes
# (Marine::*, Wijaya::Batteries::*) whose module path does not map onto the
# battery's on-disk layout, so the path-format cop cannot be satisfied here.
RSpec/SpecFilePathFormat:
  Exclude:
    - 'spec/custom/wijaya/**/*'

# Battery specs are self-contained seam suites: they mock external LLM/HTTP
# providers with plain and any-instance doubles, define local stub classes for
# provider contracts, and stub the subject to drive fail-open branches. These
# are deliberate test-topology choices for the battery boundary, not core style.
RSpec/VerifiedDoubles:
  Exclude:
    - 'spec/custom/wijaya/**/*'
RSpec/AnyInstance:
  Exclude:
    - 'spec/custom/wijaya/**/*'
RSpec/InstanceVariable:
  Exclude:
    - 'spec/custom/wijaya/**/*'
RSpec/SubjectStub:
  Exclude:
    - 'spec/custom/wijaya/**/*'
RSpec/LeakyConstantDeclaration:
  Exclude:
    - 'spec/custom/wijaya/**/*'
RSpec/RepeatedExample:
  Exclude:
    - 'spec/custom/wijaya/**/*'
RSpec/DescribeClass:
  Exclude:
    - 'spec/custom/wijaya/**/*'
RSpec/DescribeMethod:
  Exclude:
    - 'spec/custom/wijaya/**/*'
RSpec/LetSetup:
  Exclude:
    - 'spec/custom/wijaya/**/*'
# Stub classes defined inside example groups (paired with LeakyConstantDeclaration).
Lint/ConstantDefinitionInBlock:
  Exclude:
    - 'spec/custom/wijaya/**/*'

# Standalone CLI tooling and diagnostic scripts legitimately write to stdout and
# call exit — Rails.logger would defeat their operator-facing purpose.
Rails/Output:
  Exclude:
    - 'script/bulk_reindex_messages.rb'
    - 'script/monitor_reindex.rb'
    - 'script/reindex_single_account.rb'
    - 'docker/entrypoints/helpers/pg_database_url.rb'
    - 'spec/support/opensearch_check.rb'
    - 'custom/wijaya/batteries/development_version/scripts/**/*'
    - 'spec/custom/wijaya/**/*'
Rails/Exit:
  Exclude:
    - 'custom/wijaya/batteries/development_version/scripts/**/*'
    # Fail-closed test-database guard: aborting the process is the safety behavior.
    - 'custom/wijaya/batteries/test_database_safety/guard.rb'
