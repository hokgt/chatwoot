Style/ClassAndModuleChildren:
  EnforcedStyle: compact
  Exclude:
    - 'config/application.rb'
    - 'config/initializers/monkey_patches/*'
    # WIJAYA: standalone battery bootstrap files that are `require`d directly
    # (not via Zeitwerk) before their Wijaya parent namespace is autovivified.
    # They MUST use nested module/class declarations so each parent constant is
    # created on the way in; the compact form autocorrection raised
    # `uninitialized constant Wijaya::...` at boot and the initializer failed
    # open, silently leaving the batteries unloaded (CI collection regression).
    - 'custom/wijaya/batteries/test_database_safety/guard.rb'
    - 'custom/wijaya/batteries/core/loader.rb'
    - 'custom/wijaya/batteries/core/hooks.rb'
    - 'custom/wijaya/batteries/core/routes.rb'
    - 'custom/wijaya/batteries/marine_ai/loader.rb'
    - 'custom/wijaya/batteries/meta_ads_team_routing/loader.rb'
    - 'custom/wijaya/batteries/meta_ads_team_routing/hooks.rb'
    - 'custom/wijaya/batteries/meta_ads_team_routing/routing_service.rb'
    - 'custom/wijaya/batteries/automatic_assignment_activity/loader.rb'
    - 'custom/wijaya/batteries/automatic_assignment_activity/hooks.rb'
    - 'custom/wijaya/batteries/automatic_assignment_activity/system_assignment.rb'
    - 'custom/wijaya/batteries/erp_lead_sidebar/loader.rb'
    - 'custom/wijaya/batteries/erp_lead_sidebar/refresh_service.rb'
    - 'custom/wijaya/batteries/erp_lead_sidebar/options_service.rb'
    - 'custom/wijaya/batteries/custom_roles/hooks.rb'
    - 'custom/wijaya/batteries/ads_tracking/hooks.rb'
    - 'custom/wijaya/batteries/ads_tracking/referral_parser.rb'
    - 'custom/wijaya/batteries/ads_tracking/referral_video_fetcher.rb'
    - 'custom/wijaya/batteries/development_version/hooks.rb'
    # Standalone smoke scripts (run via bare `ruby`, not rspec) that create the
    # Wijaya parent chain themselves; compact declarations raise before Wijaya exists.
    - 'spec/custom/wijaya/erp_lead_sidebar/refresh_service_smoke.rb'
    - 'spec/custom/wijaya/erp_lead_sidebar/sync_service_smoke.rb'
    # WIJAYA: the Marine provisioning service family. Every class/module in this
    # directory references unqualified sibling constants (StateStore, Config,
    # Errors, Connection, Audit, ErrorSanitizer, IdentifierValidator,
    # PrivilegeService, ProvisionService). Those resolve ONLY when the files use
    # nested `module Marine; module Provisioning; ...` declarations, so the shared
    # Marine::Provisioning lexical scope is on the lookup path. The compact-form
    # autocorrection collapsed them to `class Marine::Provisioning::X`, which drops
    # Marine::Provisioning from lexical nesting and raised `uninitialized constant`
    # on autoload (3 dry-run collection errors). Scoped to this exact path only —
    # not a blanket battery exclusion.
    - 'custom/wijaya/batteries/marine_ai/app/services/marine/provisioning/*.rb'
    # WIJAYA: the Marine catalog and documents (SOP) service families. Same failure
    # mode as provisioning above: classes/modules in these directories reference
    # unqualified sibling constants (Config, Connection, Errors, UploadValidator,
    # CommandRunner, TextNormalizer, PdfExtractor, ImageOcrService, ExtractionService).
    # Those resolve ONLY with nested `module Marine; module Catalog/Documents[; module
    # Sop]; ...` declarations that keep the shared Marine lexical scope on the lookup
    # path. The compact-form autocorrection collapsed them to `class Marine::X::Y`,
    # dropping the parent namespaces from lexical nesting and raising `uninitialized
    # constant` on the runtime paths (e.g. Marine::Catalog::ProductFamilyRepository::Config,
    # Marine::Documents::Sop::ExtractionService::CommandRunner). Scoped to these exact
    # paths only — not a blanket battery exclusion, and only this Style cop.
    - 'custom/wijaya/batteries/marine_ai/app/services/marine/catalog/*.rb'
    - 'custom/wijaya/batteries/marine_ai/app/services/marine/documents/*.rb'
    - 'custom/wijaya/batteries/marine_ai/app/services/marine/documents/sop/*.rb'
    # WIJAYA: the SOP ProcessJob dispatches to the extraction pipeline via the
    # unqualified sibling `Sop::ExtractionService`, which resolves ONLY with the
    # nested `module Marine; module Documents; class ProcessJob` declaration that
    # keeps Marine::Documents on the lexical lookup path. The compact-form
    # autocorrection collapsed it to `class Marine::Documents::ProcessJob`, dropping
    # Marine::Documents from nesting so `Sop::ExtractionService` raised NameError at
    # runtime; the job's `rescue StandardError` then swallowed it and every document
    # was silently marked failed with nil content. Scoped to this one file only.
    - 'custom/wijaya/batteries/marine_ai/app/jobs/marine/documents/process_job.rb'

