# Deploy Check — validates that the self-hosted Development target is running the
# EXACT commit under review, and is healthy.
#
# OPERATOR CONTRACT: this workflow NEVER deploys and needs no SSH/secrets. The
# shared self-hosted Development target is deployed out-of-band (manually) by the
# operator; this job only polls the externally deployed candidate and validates
# it. Configure the base URL as the non-secret repository variable
# vars.DEPLOY_CHECK_BASE_URL (https://...). The check cannot pass against a
# healthy target running a different SHA. Logic lives in
# .github/scripts/deploy_check.sh.
name: Deploy Check

on:
  pull_request:

# Single shared Development target -> serialize validations globally (not per PR)
# so runs never overlap. cancel-in-progress is false so a newer PR cannot cancel
# a validation already in flight against the shared target.
concurrency:
  group: deploy-check-shared-development-target
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deployment_check:
    name: Check Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deploy check script
        uses: actions/checkout@v4
      - name: Validate deployed SHA and health
        env:
          DEPLOY_CHECK_BASE_URL: ${{ vars.DEPLOY_CHECK_BASE_URL }}
          DEPLOY_CHECK_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/deploy_check.sh
